name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest -m "not live and not postgres"

  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --global @mermaid-js/mermaid-cli@11.17.0
      - run: node scripts/render-diagrams.mjs --check
      - run: uv sync --frozen --no-dev --group docs
      - run: uv run --frozen --no-dev --group docs mkdocs build --strict
      - run: uv build
      - run: uv run --isolated --with dist/*.whl python -c "import langgraph_xai"


site_name: langgraph-xai
site_description: Provider-neutral explainability for LangGraph applications
site_url: https://samamuniharish.github.io/langgraph-xai/
repo_name: samamuniharish/langgraph-xai
repo_url: https://github.com/samamuniharish/langgraph-xai
edit_uri: edit/main/docs/

watch:
  - src

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true


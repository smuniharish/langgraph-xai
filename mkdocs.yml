site_name: langgraph-xai
site_description: >-
  Explainability for LangGraph applications: what ran, why it was decided,
  and what each audience may see.
site_url: https://langgraph-xai.readthedocs.io/en/latest/
repo_name: smuniharish/langgraph-xai
repo_url: https://github.com/smuniharish/langgraph-xai
edit_uri: edit/master/docs/
copyright: Released under the Apache License 2.0.

watch:
  - src

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Click a diagram to open it full size, with zoom.
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            extensions:
              - griffe_pydantic:
                  schema: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Overview: concepts/index.md
      - Execution: concepts/execution.md
      - Evidence: concepts/evidence.md
      - Decisions: concepts/decisions.md
      - Provenance: concepts/provenance.md
      - Attribution: concepts/attribution.md
      - Explanations: concepts/explanations.md
      - Policies: concepts/policies.md
  - How-to guides:
      - Overview: how-to/index.md
      - Explain a decision after the run: how-to/explain-after-run.md
      - Handle human-in-the-loop interrupts: how-to/interrupts.md
      - Correlate multi-agent runs and retries: how-to/multi-agent.md
      - Capture MCP tool calls: how-to/mcp-tools.md
      - Generate LLM-phrased explanations: how-to/llm-explanations.md
      - Test disclosure policies: how-to/disclosure-policies.md
      - Configure failure modes: how-to/failure-modes.md
  - Examples:

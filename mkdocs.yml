      - Minimal graph: examples/minimal-graph.md
      - "Fraud review: full explanation": examples/full-explanation.md
      - Retrieval and tools: examples/retrieval-and-tools.md
      - Human-in-the-loop: examples/interrupt-hitl.md
      - Multi-agent retries and correlation: examples/multi-agent-retry.md
      - Disclosure matrix: examples/disclosure-matrix.md
      - create_agent decision: examples/create-agent.md
      - create_agent inside a node: examples/create-agent-nested.md
      - deepagents: examples/deepagents.md
